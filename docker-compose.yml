# Easy English — web + Postgres (+ optional nightly backup)
#
# Local: copy `.env.example` → `.env`, then:
#   docker compose up --build -d
#   docker compose run --rm web seed --content
#
# See README.md and docs/deploy-proxy.md.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-easy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easy}
      POSTGRES_DB: ${POSTGRES_DB:-easy_english}
    volumes:
      - easy_english_pg:/var/lib/postgresql/data
      - ./scripts/docker-init-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easy} -d ${POSTGRES_DB:-easy_english}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: easy-english-web:local
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgres://easy:easy@db:5432/easy_english}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      STORAGE_DIR: /app/storage
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - easy_english_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Nightly pg_dump → gzip under the backups volume (retention via BACKUP_RETENTION_DAYS).
  # Host alternative: cron `./scripts/pg-backup.sh` with PG* env vars.
  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-easy}
      PGPASSWORD: ${POSTGRES_PASSWORD:-easy}
      PGDATABASE: ${POSTGRES_DB:-easy_english}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - easy_english_backups:/backups
      - ./scripts/pg-backup.sh:/pg-backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache dcron >/dev/null
        chmod +x /pg-backup.sh
        echo "0 3 * * * /pg-backup.sh >> /var/log/backup.log 2>&1" > /etc/crontabs/root
        /pg-backup.sh
        exec crond -f -l 2
    restart: unless-stopped

volumes:
  easy_english_pg:
  easy_english_storage:
  easy_english_backups:
